name: Build and release APK + Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GIT_SHA: ${{ github.sha }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opotracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset (needed by jpackage to build the .exe installer)
        run: choco install wixtoolset -y --no-progress

      - name: Build Windows desktop installer
        env:
          GIT_SHA: ${{ github.sha }}
        run: ./gradlew.bat :app:packageDistributionForCurrentOS --stacktrace

      - name: Locate generated .exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path app/build/compose/binaries -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "No .exe found under app/build/compose/binaries"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName "dist/OpoTracker-Setup.exe"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: opotracker-exe
          path: dist/OpoTracker-Setup.exe
          if-no-files-found: error

  publish-release:
    needs: [build-apk, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: opotracker-apk
          path: release-files

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: opotracker-exe
          path: release-files

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OpoTracker (última versión)
          body: |
            Compilación automática del último commit en `main` (${{ github.sha }}).

            - **Android**: descarga el `.apk` e instálalo en tu móvil (activa "instalar apps de origen desconocido" la primera vez).
            - **Windows**: descarga `OpoTracker-Setup.exe` y ejecútalo para instalar la app de escritorio.
          make_latest: true
          files: |
            release-files/app-debug.apk
            release-files/OpoTracker-Setup.exe
