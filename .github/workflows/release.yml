name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GIT_SHA: ${{ github.sha }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OpoTracker (última versión)
          body: |
            Compilación automática del último commit en `main` (${{ github.sha }}).
            Descarga el APK de abajo e instálalo en tu móvil (activa "instalar apps de origen desconocido" la primera vez).
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
